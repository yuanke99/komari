name: Build and Push Fixed Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SW fix
        run: |
          # Only replace the if-block that precedes stripServiceWorkerRegistration
          LINE=$(grep -n 'stripServiceWorkerRegistration(htmlStr)' web/public/public.go | head -1 | cut -d: -f1)
          sed -i "$((LINE-1))s/if forceDefaultTheme {/if forceDefaultTheme || !shouldReplace {/" web/public/public.go
          grep -q "if forceDefaultTheme || !shouldReplace {" web/public/public.go || { echo "Fix failed to apply"; exit 1; }
          echo "Fix applied successfully"

      - name: Build frontend
        uses: ./.github/actions/build-frontend
        with:
          ref: 1.5.0-fix1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install arm64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build amd64 binary
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc go build -trimpath -ldflags="-s -w" -o komari-linux-amd64 .

      - name: Build arm64 binary
        run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -trimpath -ldflags="-s -w" -o komari-linux-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/komari:fixed
