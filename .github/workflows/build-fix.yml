name: Build and Push Fixed Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SW fix
        run: |
          # Only replace the if-block that precedes stripServiceWorkerRegistration
          LINE=$(grep -n 'stripServiceWorkerRegistration' web/public/public.go | head -1 | cut -d: -f1)
          sed -i "$((LINE-1))s/if forceDefaultTheme {/if forceDefaultTheme || !shouldReplace {/" web/public/public.go
          grep -q "if forceDefaultTheme || !shouldReplace {" web/public/public.go || { echo "Fix failed to apply"; exit 1; }
          echo "Fix applied successfully"

      - name: Build frontend
        uses: ./.github/actions/build-frontend
        with:
          ref: 1.5.0-fix1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" -o komari-linux-amd64 .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/komari:fixed
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64