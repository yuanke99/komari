name: Build and Push Fixed Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SW fix
        run: |
          # Only replace the if-block that precedes stripServiceWorkerRegistration
          LINE=$(grep -n 'stripServiceWorkerRegistration(htmlStr)' web/public/public.go | head -1 | cut -d: -f1)
          sed -i "$((LINE-1))s/if forceDefaultTheme {/if forceDefaultTheme || !shouldReplace {/" web/public/public.go
          grep -q "if forceDefaultTheme || !shouldReplace {" web/public/public.go || { echo "Fix failed to apply"; exit 1; }
          echo "Fix applied successfully"

      - name: Create multi-stage Dockerfile
        run: |
          cat > Dockerfile.multi <<'DOCKERFILE'
          # Stage 1: Build frontend (komari-web)
          FROM node:23-alpine AS frontend
          RUN apk add --no-cache git zstd tar
          ARG KOMARI_WEB_REF=1.5.0-fix1
          WORKDIR /build
          RUN git clone --depth=1 --branch "$KOMARI_WEB_REF" https://github.com/komari-monitor/komari-web.git komari-web
          WORKDIR /build/komari-web
          RUN npm install && npm run build
          WORKDIR /build
          RUN mkdir -p defaultTheme && \
              tar -cf defaultTheme/dist.tar -C komari-web/dist . && \
              zstd -19 -T0 -q -f defaultTheme/dist.tar -o defaultTheme/dist.tar.zst && \
              rm defaultTheme/dist.tar && \
              cp komari-web/komari-theme.json defaultTheme/ && \
              (cp komari-web/preview.png defaultTheme/ 2>/dev/null || true)

          # Stage 2: Build Go backend
          FROM golang:1.25-alpine AS backend
          RUN apk add --no-cache gcc musl-dev
          WORKDIR /build
          COPY . .
          COPY --from=frontend /build/defaultTheme/ web/public/defaultTheme/
          RUN go build -trimpath -ldflags="-s -w" -o komari .

          # Stage 3: Final image
          FROM alpine:3.21
          WORKDIR /app
          RUN apk add --no-cache ca-certificates curl tzdata
          COPY --from=backend /build/komari /app/komari
          ENV GIN_MODE=release
          ENV KOMARI_LISTEN=0.0.0.0:25774
          EXPOSE 25774
          CMD ["/app/komari", "server"]
          DOCKERFILE

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multi
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/komari:fixed
